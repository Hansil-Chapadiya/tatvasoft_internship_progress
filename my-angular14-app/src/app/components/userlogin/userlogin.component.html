<form (ngSubmit)="userLogin()">
    <div class="container">
        <div class="login-container">
            <div class="login-title">User Login</div>

            <label for="email">Email</label>
            <input [(ngModel)]="emailAddress" name="email" type="email" id="email" required />

            <label for="password">Password</label>
            <input [(ngModel)]="password" name="password" type="password" id="password" required />

            <button type="submit">Login</button>
            <p *ngIf="errorMessage">{{ errorMessage }}</p>
        </div>
    </div>
</form>
